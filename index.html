<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .form-container,
        .book-container {
            background-color: white;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 10px;
        }

        form {
            display: grid;
            gap: 10px;
        }

        label {
            font-weight: bold;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.8;
        }

        #searchResult {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #f4f4f4;
            line-height: 1.8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Book Management System</h1>

        <!-- ADD / UPDATE FORM -->

        <div class="form-container">

            <h2>Add Book</h2>

            <form id="bookForm">

                <label for="title">Book Title</label>

                <input type="text" id="title" placeholder="Enter book title">


                <label for="author">Author</label>

                <input type="text" id="author" placeholder="Enter author name">


                <label for="price">Price</label>

                <input type="number" id="price" placeholder="Enter price">


                <label for="category">Category</label>

                <select id="category">

                    <option value="">Select Category</option>

                    <option value="Novel">
                        Novel
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Fantasy">
                        Fantasy
                    </option>

                    <option value="Biography">
                        Biography
                    </option>

                    <option value="Self Help">
                        Self Help
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                </select>


                <button type="submit" id="submitButton">
                    Add Book
                </button>

            </form>

        </div>

        <div class="form-container">

            <h2>Search Book</h2>

            <input type="text" id="searchTitle" placeholder="Enter book title">

            <button type="button" onclick="searchBook()">
                Search
            </button>

            <div id="searchResult"></div>

        </div>


        <!-- BOOK LIST -->

        <div class="book-container">

            <h2>Book List</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Action</th>
                    </tr>

                </thead>


                <tbody id="bookList">

                    <!-- Books will come here -->

                </tbody>

            </table>

        </div>

    </div>


    <script src="book.js"></script>

</body>

</html>
